# Wrangler config for the smid-scanner-discord-bot Cloudflare Worker.
#
# This config drives `wrangler deploy` so you can push worker.js changes
# from the CLI instead of pasting into the dashboard editor.
#
# The `PAT` secret (GitHub fine-grained token used to dispatch the
# ticker-lookup workflow) is NOT defined here — secrets live in the
# Cloudflare environment, not in source. Set or rotate it with:
#   wrangler secret put PAT
# Existing secrets are preserved across deploys, so you only set this
# once (or when rotating).

name               = "smid-scanner-discord-bot"
main               = "worker.js"
compatibility_date = "2026-05-20"

# Non-secret runtime config — these are public values (URLs, project IDs)
# that the worker needs but don't require encryption. Anything sensitive
# (API keys, signing secrets, service_role keys) lives ONLY in worker
# secrets — set them via `wrangler secret put NAME` or the dashboard
# Variables and Secrets section (Type: Secret).
[vars]
SUPABASE_URL = "https://uaeojibmhxbwkhpvmjwy.supabase.co"

# Observability: minimal config matching what Cloudflare's dashboard
# generates. logs.enabled + invocation_logs are the only knobs that
# matter for our use; head_sampling_rate and persist default sensibly.
# Lets us see worker console output in the dashboard Logs tab + via
# `npx wrangler tail` from terminal.
[observability.logs]
enabled = true
invocation_logs = true
