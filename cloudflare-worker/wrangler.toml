# Wrangler config for the smid-scanner-discord-bot Cloudflare Worker.
#
# This config drives `wrangler deploy` and the GH Actions auto-deploy
# workflow (.github/workflows/deploy_worker.yml). Keep this file in
# sync with whatever the Cloudflare dashboard generates — every time
# you toggle settings in the dashboard, Wrangler complains on the next
# deploy if local doesn't match remote.
#
# Secrets (sensitive values) are NOT defined here — they live in the
# Cloudflare worker environment and are set via the dashboard or
# `wrangler secret put NAME`. Existing secrets are preserved across
# deploys.

name               = "smid-scanner-discord-bot"
main               = "worker.js"
compatibility_date = "2026-05-20"

# Non-secret runtime config. Anything sensitive (API keys, signing
# secrets, service_role keys) lives ONLY in worker secrets.
[vars]
SUPABASE_URL = "https://uaeojibmhxbwkhpvmjwy.supabase.co"
REPO = "brownplaya239/smid-scanner"

# Observability — exact match to what the Cloudflare dashboard
# currently generates. Cloudflare reformats this section every time
# you toggle a setting in the dashboard, and any mismatch causes the
# "remote config differs" loop that blocks Logs/Observability tabs.
# If you re-toggle in the dashboard, copy the JSONC shown there back
# into TOML form here.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
