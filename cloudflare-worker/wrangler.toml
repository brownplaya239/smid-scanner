# Wrangler config for the smid-scanner-discord-bot Cloudflare Worker.
#
# This config drives `wrangler deploy` and the GH Actions auto-deploy
# workflow (.github/workflows/deploy_worker.yml). Keep this file in
# sync with whatever the Cloudflare dashboard generates — every time
# you toggle settings in the dashboard, Wrangler complains on the next
# deploy if local doesn't match remote.
#
# Secrets (sensitive values) are NOT defined here — they live in the
# Cloudflare worker environment and are set via the dashboard or
# `wrangler secret put NAME`. Existing secrets are preserved across
# deploys.

name               = "smid-scanner-discord-bot"
main               = "worker.js"
compatibility_date = "2026-05-20"

# ── Cron backstop ──────────────────────────────────────────────────
# Cloudflare Cron Triggers fire the worker's scheduled() handler, which
# pokes the GitHub scans via workflow_dispatch (reusing env.PAT). This
# exists because GitHub's own `schedule:` cron is unreliable and dropped
# every scheduled workflow on 2026-06-03. GitHub schedules stay primary
# (all 6 UOA fire times); these are redundant insurance for the most
# important windows. Offset ~3 min from the GH-native crons so a
# double-fire is harmless — emit_latest dedups by timestamp. UTC,
# weekdays only.
#
# On Workers Paid (since 2026-07-06) the free-plan 5-cron cap is lifted, so
# the backstop now covers the two previously-uncovered in-between UOA slots
# (~11am late-morning, ~1pm early-afternoon) too — no market-hours gap wider
# than ~1.5h without a Cloudflare-cron backstop, independent of GitHub's
# flaky scheduler. Every fire also runs healPublish() (self-heal if the
# published data goes >3h stale). scheduled() dispatches uoa.yml for every
# cron except the EOD one (which fires scanner+momentum).
[triggers]
# 2026-09-21/22: GitHub dropped EVERY uoa.yml cron two sessions in a row
# (other, lower-frequency workflows still fired). The worker is now the
# PRIMARY intraday scheduler on a ~30-min RTH grid; GitHub's schedule
# stays as redundant insurance. emit_latest dedups double-fires.
crons = [
  "50 13 * * MON-FRI",   # ~9:50 AM ET — opening UOA
  "20 14 * * MON-FRI",   # ~10:20 AM ET
  "50 14 * * MON-FRI",   # ~10:50 AM ET
  "20 15 * * MON-FRI",   # ~11:20 AM ET
  "50 15 * * MON-FRI",   # ~11:50 AM ET
  "20 16 * * MON-FRI",   # ~12:20 PM ET — also dispatches the monitor
  "50 16 * * MON-FRI",   # ~12:50 PM ET
  "20 17 * * MON-FRI",   # ~1:20 PM ET
  "50 17 * * MON-FRI",   # ~1:50 PM ET
  "20 18 * * MON-FRI",   # ~2:20 PM ET
  "50 18 * * MON-FRI",   # ~2:50 PM ET
  "20 19 * * MON-FRI",   # ~3:20 PM ET
  "50 19 * * MON-FRI",   # ~3:50 PM ET — pre-close; also dispatches the monitor
  "40 20 * * MON-FRI",   # ~4:40 PM ET — EOD: scanner + momentum
  # Social posts (SOCIAL_SCHEDULE in worker.js, matched on the ET clock).
  # 12:00-23:45 UTC Mon-Fri + 00:00-01:45 UTC Tue-Sat covers 8 AM-8:45 PM
  # ET in both EDT and EST. Off unless SOCIAL_SCHEDULE = "1" below.
  "*/15 12-23 * * MON-FRI",
  "*/15 0-1 * * TUE-SAT",
]

# Non-secret runtime config. Anything sensitive (API keys, signing
# secrets, service_role keys) lives ONLY in worker secrets.
#
# SUPABASE_ANON_KEY is intentionally a var — it's public-facing and
# already lives in the static site's JS. The worker uses it as the
# `apikey` header when validating user JWTs via /auth/v1/user.
# Published site data (git -> R2 migration, 2026-09-27). The worker
# serves /reports/*.json from here with a Pages fallback.
[[r2_buckets]]
binding     = "DATA"
bucket_name = "tickerdesk-data"

[vars]
SUPABASE_URL = "https://uaeojibmhxbwkhpvmjwy.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_Lsy2m1QG18tkGYwizS-_0A_LhfIFXdo"
REPO = "brownplaya239/smid-scanner"
# Market Buzz full-market scan (fetchPremarketBuzz). Parses the ~6MB
# all-tickers snapshot, which needs the Workers Paid CPU budget (the free
# plan's 10ms limit would kill it). Set to "1" now that the account is on
# Workers Paid. Kill-switch: change to "0" (or remove) to instantly revert
# to the ~20-name gainers/losers fallback.
PMB_FULL_SCAN = "1"
# Scheduled X posts (see SOCIAL_SCHEDULE in worker.js). "0" = off.
SOCIAL_SCHEDULE = "0"

# Observability — exact match to what the Cloudflare dashboard
# currently generates. Cloudflare reformats this section every time
# you toggle a setting in the dashboard, and any mismatch causes the
# "remote config differs" loop that blocks Logs/Observability tabs.
# If you re-toggle in the dashboard, copy the JSONC shown there back
# into TOML form here.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
