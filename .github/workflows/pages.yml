name: Build & Deploy Pages

# Replaces GitHub's legacy branch-build for Pages. Serves a MINIFIED
# index.html (html-minifier-terser: collapse whitespace + minify inline
# CSS/JS) for faster parse + ~46% smaller transfer, while docs/index.html
# stays the readable source. Everything else under docs/ (reports/, sw.js,
# scored-worker.js, vendor/, CNAME, etc.) is copied through untouched.
#
# GRACEFUL DEGRADATION: if minification fails or its output fails the
# sanity gates, the build deploys the UNMINIFIED index.html instead of
# failing — so a data publish (the scanner commits to docs/reports ~6x/day)
# is never blocked by a build hiccup. Worst case == today's behavior.
# 2026-06-10 ROLLBACK: Pages is back on the native legacy build. The
# workflow-based deploy FROZE the site during a selloff — the scanner's
# data commits are pushed with GITHUB_TOKEN, and GitHub never triggers
# push workflows from GITHUB_TOKEN commits (anti-recursion), so ~10 data
# commits piled up unpublished while pages-build-deployment sat idle.
# Re-enabling requires BOTH: (a) the scanner pushing with a PAT (or this
# workflow gaining a schedule/cron trigger as a sweeper), AND (b) Pages
# build_type switched back to "workflow". Until then: manual dispatch
# only, and deploy-pages would fail anyway while build_type=legacy.
#
# 2026-07-02 RE-ENABLED: the legacy branch build broke — Pages ran Jekyll
# over the 95MB site and the deploy step timed out on the huge JSON, so
# nothing published for hours. Solving the 6/10 anti-recursion trap the
# right way this time: `workflow_run` triggers fire on scan COMPLETION
# regardless of the GITHUB_TOKEN push, so scanner data still publishes; a
# cron sweeper + push cover the rest. build_type is set to "workflow".
on:
  # Immediate deploy on human / real-token pushes to the site.
  push:
    branches: [master]
    paths: ['docs/**']
  # RELIABLE trigger for scanner data commits: those are pushed with
  # GITHUB_TOKEN, which does NOT fire `push` workflows (anti-recursion —
  # exactly what froze the site on 2026-06-10). `workflow_run` fires when
  # the named workflow COMPLETES regardless of the committing token, so
  # each scan's freshly-committed data gets published.
  workflow_run:
    # INVARIANT: every workflow that commits to docs/ belongs in this list.
    # A committer missing from it does not publish until the ~20-min cron
    # sweeper runs, which is invisible for scheduled scans and fatal for
    # anything a user is waiting on. "Ticker Research Brief (v2)" was
    # missing: on-demand reports generated in ~60s, committed, and then sat
    # unpublished past the page's 7-minute poll deadline, so every
    # user-triggered report ended in "Timed out waiting for the report"
    # even though the PDF existed. Both lookup workflows are dispatchable
    # from the worker (WORKFLOWS = {adhoc, altdata}), so both are listed.
    workflows:
      - "Unusual Options Activity"
      - "SMID Breakout Scanner"
      - "Momentum Scans"
      - "Daily Brief"
      - "Ticker Research Brief (v2)"
      - "Alt-Data Intelligence Lookup"
    types: [completed]
  # Catch-all sweeper — republish the latest docs/ periodically so a
  # committer not in the list above (or a missed workflow_run) still lands
  # within ~20 min. GitHub cron is best-effort; this is only a backstop.
  schedule:
    - cron: '*/20 12-22 * * 1-5'   # ~every 20 min, 8am–6pm ET weekdays
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-progress deploy (a cancelled Pages deploy can leave
# the site in a half-published state); queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble _site (best-effort minify of index.html)
        run: |
          set -uo pipefail
          rm -rf _site && mkdir -p _site
          cp -r docs/. _site/
          ok=0
          if npx --yes html-minifier-terser@7 docs/index.html \
                --collapse-whitespace --remove-comments \
                --minify-css --minify-js -o /tmp/min.html; then
            src=$(wc -c < docs/index.html); out=$(wc -c < /tmp/min.html)
            if [ "$out" -gt 300000 ] && [ "$out" -lt "$src" ] \
               && node scripts/verify_inline_js.js /tmp/min.html; then
              cp /tmp/min.html _site/index.html
              ok=1
              echo "::notice::index.html minified ${src} -> ${out} bytes"
            fi
          fi
          if [ "$ok" != "1" ]; then
            echo "::warning::minify skipped/failed — deploying UNMINIFIED index.html"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
