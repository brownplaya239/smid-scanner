name: UOA Matched Scorecard

# Nightly matched-control scorecard rebuild (2026-09 redesign):
# whole-market bar matrix (one grouped call per trading day), frozen
# control assignments, cluster-bootstrap inference, net-of-cost EV,
# entry-lag minute sample (incremental budget), calibration, capacity,
# book sim, crowding. Runs AFTER the close so the day's signals grade
# with settled bars.

on:
  schedule:
    - cron: '30 23 * * 1-5'   # ~7:30 PM ET
  workflow_dispatch:

# Shares data files with the other uoa/momentum/scorecard runs
# (uoa_alpha_cache, oi_lifecycle, the ledger). In R2 overlapping writers
# would lose updates, so these three workflows take turns. Runs are ~5
# min; a queued run superseded by a newer one is dropped, which is fine
# for scans (the newer run covers it).
concurrency:
  group: tickerdesk-data
  cancel-in-progress: false


env:
  # uv: workflow steps use only the locked runtime packages, never the dev
  # tools (pytest, Ruff, Pyrefly), even when a step calls `uv run`.
  UV_NO_DEV: "1"

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Pull data from R2
        # Data lives in Cloudflare R2 since 2026-09-28 (not git). Records a
        # manifest so publish only uploads what this job changed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run scripts/r2_sync.py pull

      - name: Build matched scorecard
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: uv run python uoa_scorecard.py

      - name: Track callout results (option-level)
        # Daily Top 25 callouts: entry at first flag, peak, latest.
        # Publishes callouts.json for the Callout Results tab.
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: uv run python callout_tracker.py

      - name: Re-run hypothesis lab with BH correction
        # reads the fresh scorecard's effective-n deflation. Needs the key:
        # the lab scores the active window from fresh bars (read-only).
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: uv run python hypothesis_lab.py --force

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/publish_reports.sh
