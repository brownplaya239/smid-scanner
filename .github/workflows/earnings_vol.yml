name: Earnings Vol Backtest

# Historical option-P&L reconstruction for the vol_rich / vol_cheap
# signal events (Earnings Volatility Alpha Engine, part 2). Runs
# nightly after the earnings-ideas grading has settled, plus on
# demand. Incremental: per-event reconstructions cache in
# data/earnings_vol_pnl.json, so a run only prices new events.
# trade_qualified in the emitted report is the ONLY thing that can
# promote a vol type from Qualified Signal to Qualified Trade.

on:
  schedule:
    - cron: '45 22 * * 1-5'   # ~6:45 PM ET, after the close + grading
  workflow_dispatch:

concurrency:
  group: earnings-vol
  cancel-in-progress: false

env:
  # uv: workflow steps use only the locked runtime packages, never the dev
  # tools (pytest, Ruff, Pyrefly), even when a step calls `uv run`.
  UV_NO_DEV: "1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Pull data from R2
        # Data lives in Cloudflare R2 since 2026-09-28 (not git). Records a
        # manifest so publish only uploads what this job changed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run scripts/r2_sync.py pull

      - name: Reconstruct option P&L for graded vol events
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: uv run python earnings_vol_backtest.py

      - name: Execution-quality study (NBBO package fills)
        # V3: entitlement-probed; incremental quote cache means each
        # nightly run only fetches windows for new events. Non-fatal —
        # an entitlement gap publishes an honest status, not a crash.
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: uv run python earnings_vol_exec.py

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/publish_reports.sh
