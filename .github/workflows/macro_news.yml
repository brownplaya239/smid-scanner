name: Macro News Relay

# Relays Finnhub's macro/general wire (commodities, Fed, geopolitics)
# into Supabase news_live — the table the live tape already merges.
# Runs from Actions because Finnhub rejects Cloudflare Workers egress
# IPs; see macro_news_relay.py for the full story.

on:
  schedule:
    # every 20 min, 07:00–17:40 ET (11:00–21:40 UTC), weekdays —
    # premarket through after-hours
    - cron: '*/20 11-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: macro-news-relay
  cancel-in-progress: true

env:
  # uv: workflow steps use only the locked runtime packages, never the dev
  # tools (pytest, Ruff, Pyrefly), even when a step calls `uv run`.
  UV_NO_DEV: "1"

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            macro_news_relay.py
            pyproject.toml
            uv.lock
            .python-version
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Relay macro headlines
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run python macro_news_relay.py
