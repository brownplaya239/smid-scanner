name: Daily Brief

on:
  schedule:
    # 8:45 AM ET weekdays. GitHub delays top/half-hour schedules heavily,
    # so cron is :47 past for the actual ~8:47 ET fire time.
    # Single cron — GitHub cron is literal UTC with no DST handling. Both
    # entries previously fired year-round (a bug). Picked EDT cron because
    # the brief is purely a pre-open digest, and 1 hr earlier during EST
    # winter (7:47 AM ET) is still pre-market and harmless.
    # email_log idempotency check in daily_brief.py also de-dupes any
    # accidental double-fire on the same brief_date.
    - cron: '47 12 * * 1-5'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (build emails, do not send)'
        required: false
        default: 'false'
      restrict_email:
        description: 'Only send to this email (for testing)'
        required: false
        default: ''

jobs:
  daily-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the freshly-generated carryover file back
    env:
      # Service-role key bypasses RLS so we can read everyone's
      # watchlist + send mail on their behalf. NEVER expose this in
      # client code — it lives only in the repo's Actions secrets.
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
      FROM_EMAIL:           ${{ secrets.FROM_EMAIL }}
      SITE_URL:             https://tickerdesk.io
      # Pre-open OI-retention check on yesterday's notable flow.
      POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # We need the latest JSON outputs from the prior overnight
          # scan, which the momentum workflow commits back to the
          # branch. A shallow fetch is fine — we're not branching.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build OI-confirmed carryover flow
        # Re-checks yesterday's notable prints against this morning's
        # OCC-settled open interest. Non-fatal: the brief still sends if
        # this fails (e.g. Polygon hiccup) — it just omits the section.
        run: python carryover_flow.py || echo "carryover generation failed (non-fatal)"

      - name: Send daily brief
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.restrict_email }}" ]; then
            ARGS="$ARGS --me ${{ github.event.inputs.restrict_email }}"
          fi
          python daily_brief.py $ARGS

      - name: Commit carryover flow for the Desk tile
        # The Today's Desk "Overnight Flow" tile reads this file off Pages,
        # so publish it back to the branch. Only commits when it changed.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/carryover_flow.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No carryover change to commit."
          else
            git commit -m "Carryover flow (OI-confirmed) — pre-open $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && break || sleep 5
            done
          fi
