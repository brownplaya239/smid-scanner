name: Unusual Options Activity

on:
  schedule:
    # ~30-min cadence across market hours (weekdays). The data feed is
    # 15-min delayed, so a fresh delayed window is available every ~15 min;
    # a 30-min batch cadence captures two windows behind and keeps graded
    # flow from sitting stale. (Sub-30-min waits on a real-time data tier —
    # at that point also gate push_alerts to A/golden upgrades, since alerts
    # chain off every scan via workflow_run.) Cron is literal UTC; times are
    # off-the-hour to dodge GitHub's top-of-hour delay penalty. Single cron
    # per fire (no EDT/EST duplicates — both would fire year-round). Picked
    # EDT crons; EST winter fires land 1 hr earlier in ET.
    #
    # ~9:35–10:05 AM ET — opening cluster. Triple-fire the open because
    # GitHub's scheduler routinely SKIPS the first cron of the day under
    # load (observed 2026-06-03: the 13:47 fire never triggered, leaving the
    # desk on yesterday's scan all morning). emit_latest only writes when it
    # produces rows and dedups by timestamp, so redundant successful fires
    # just refresh to the same state — cheap insurance against a dropped open.
    - cron: '35 13 * * 1-5'   # ~9:35 AM ET
    - cron: '47 13 * * 1-5'   # ~9:47 AM ET
    - cron: '5 14 * * 1-5'    # ~10:05 AM ET
    # Then every ~30 min through the close (:05 / :35 off-hour grid).
    - cron: '35 14 * * 1-5'   # ~10:35 AM ET
    - cron: '5 15 * * 1-5'    # ~11:05 AM ET
    - cron: '35 15 * * 1-5'   # ~11:35 AM ET
    - cron: '5 16 * * 1-5'    # ~12:05 PM ET
    - cron: '35 16 * * 1-5'   # ~12:35 PM ET
    - cron: '5 17 * * 1-5'    # ~1:05 PM ET
    - cron: '35 17 * * 1-5'   # ~1:35 PM ET
    - cron: '5 18 * * 1-5'    # ~2:05 PM ET
    - cron: '35 18 * * 1-5'   # ~2:35 PM ET
    - cron: '5 19 * * 1-5'    # ~3:05 PM ET
    - cron: '35 19 * * 1-5'   # ~3:35 PM ET
    - cron: '55 19 * * 1-5'   # ~3:55 PM ET — final positioning before close

  workflow_dispatch:           # manual trigger anytime

jobs:
  uoa:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the UOA JSON back to the site

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UOA scan + alpha tracker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python uoa_scanner.py;  R1=$?
          python uoa_alpha.py;    R2=$?
          echo "scanner exit: $R1  |  alpha exit: $R2"
          if [ $R1 -ne 0 ]; then
            echo "::error::UOA scan failed (exit $R1)"
            exit 1
          fi

      - name: Publish UOA data to site
        run: bash scripts/publish_reports.sh
