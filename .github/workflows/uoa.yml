name: Unusual Options Activity

on:
  schedule:
    # 6 runs/day on weekdays — covers every ~75 min of market hours so
    # intraday flow doesn't sit stale for 2.5 hrs at a time. Cron times
    # are off-the-hour to dodge GitHub's top-of-hour delay penalty.
    # Single cron per fire time (no EDT/EST duplicates — GH cron is
    # literal UTC and BOTH would fire year-round).
    # All windows stay safely within RTH (9:30 AM – 4:00 PM ET) under
    # either DST mode; picked EDT crons for closer-to-intended timing
    # during the longer summer window. EST winter fires are 1 hr earlier.
    #
    # ~9:45 AM ET  — opening flow (first 15 min noise settled)
    - cron: '47 13 * * 1-5'
    # ~11:00 AM ET — late-morning continuation
    - cron: '7 15 * * 1-5'
    # ~12:15 PM ET — lunch-hour positioning
    - cron: '17 16 * * 1-5'
    # ~1:30 PM ET  — early afternoon
    - cron: '37 17 * * 1-5'
    # ~2:30 PM ET  — pre-power-hour positioning
    - cron: '37 18 * * 1-5'
    # ~3:45 PM ET  — final-15-min positioning before close
    - cron: '47 19 * * 1-5'

  workflow_dispatch:           # manual trigger anytime

jobs:
  uoa:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the UOA JSON back to the site

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UOA scan + alpha tracker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python uoa_scanner.py;  R1=$?
          python uoa_alpha.py;    R2=$?
          echo "scanner exit: $R1  |  alpha exit: $R2"
          if [ $R1 -ne 0 ]; then
            echo "::error::UOA scan failed (exit $R1)"
            exit 1
          fi

      - name: Publish UOA data to site
        run: bash scripts/publish_reports.sh
