name: Unusual Options Activity

on:
  schedule:
    # GitHub cron is literal UTC (no DST). The Cloudflare worker is the
    # PRIMARY scheduler and runs on the ET clock (UOA_SLOTS in worker.js);
    # these are insurance. Each line below lands inside regular hours in
    # BOTH seasons except the last two, which in EDT fire just after the
    # close (harmless: uoa_scanner only appends to the ledger during the
    # regular session; the snapshot still publishes the full day).
    #   UTC     EDT (summer)   EST (winter)
    - cron: '35 14 * * 1-5'   # 10:35 AM      9:35 AM
    - cron: '5 15 * * 1-5'    # 11:05 AM     10:05 AM
    - cron: '35 15 * * 1-5'   # 11:35 AM     10:35 AM
    - cron: '5 16 * * 1-5'    # 12:05 PM     11:05 AM
    - cron: '35 16 * * 1-5'   # 12:35 PM     11:35 AM
    - cron: '5 17 * * 1-5'    #  1:05 PM     12:05 PM
    - cron: '35 17 * * 1-5'   #  1:35 PM     12:35 PM
    - cron: '5 18 * * 1-5'    #  2:05 PM      1:05 PM
    - cron: '35 18 * * 1-5'   #  2:35 PM      1:35 PM
    - cron: '5 19 * * 1-5'    #  3:05 PM      2:05 PM
    - cron: '35 19 * * 1-5'   #  3:35 PM      2:35 PM
    - cron: '5 20 * * 1-5'    #  4:05 PM      3:05 PM
    - cron: '45 20 * * 1-5'   #  4:45 PM      3:45 PM

  workflow_dispatch:           # manual trigger anytime
    inputs:
      rebuild_alpha:
        description: >-
          One-off: re-score already-frozen flow signals from fresh
          split-adjusted bars (fixes values frozen before the 2026-11
          price-basis guard). Slower run.
        type: boolean
        default: false

# Shares data files with the other uoa/momentum/scorecard runs
# (uoa_alpha_cache, oi_lifecycle, the ledger). In R2 overlapping writers
# would lose updates, so these three workflows take turns. Runs are ~5
# min; a queued run superseded by a newer one is dropped, which is fine
# for scans (the newer run covers it).
concurrency:
  group: tickerdesk-data
  cancel-in-progress: false

env:
  # uv: workflow steps use only the locked runtime packages, never the dev
  # tools (pytest, Ruff, Pyrefly), even when a step calls `uv run`.
  UV_NO_DEV: "1"

jobs:
  uoa:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the UOA JSON back to the site

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Pull data from R2
        # Data lives in Cloudflare R2 since 2026-09-28 (not git). Records a
        # manifest so publish only uploads what this job changed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run scripts/r2_sync.py pull

      - name: Run UOA scan + alpha tracker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          uv run python uoa_scanner.py;  R1=$?
          uv run python uoa_alpha.py ${{ inputs.rebuild_alpha && '--rebuild' || '' }};    R2=$?
          echo "scanner exit: $R1  |  alpha exit: $R2"
          if [ $R1 -ne 0 ]; then
            echo "::error::UOA scan failed (exit $R1)"
            exit 1
          fi

      - name: Hedge-cohort prospective monitor (append-only record)
        # Records the potential-hedge cohort's point-in-time state each
        # batch (frozen spec v1-2026-07-21; any spec change forks a new
        # version). Append-only; never affects ranking. Non-fatal.
        continue-on-error: true
        run: uv run python hedge_monitor.py --record

      - name: AI Trade Desk — validation + engine
        # trade_desk_validation.py re-runs the walk-forward on the frozen
        # ledger (no API calls) so the flow family's qualification gate
        # tracks the growing record automatically; trade_desk.py then
        # generates/gates/freezes/grades ideas. Both are non-fatal: the
        # UOA publish must never block on the desk, and abstention (the
        # engine's honest default) is a success state, not an error.
        continue-on-error: true
        run: |
          uv run python trade_desk_validation.py
          uv run python trade_desk_research.py
          uv run python trade_desk_context.py
          uv run python earnings_vol_engine.py
          uv run python fair_move_lab.py
          uv run python trade_desk.py

      - name: Top 25 daily cumulative ranking
        # Folds this batch into the per-day accumulator and republishes
        # the diversified Top 25 (docs/reports/uoa_top25_daily.json).
        # Idempotent per batch timestamp; ET-date keyed daily reset.
        # Non-fatal: the publish step must never block on this pane.
        continue-on-error: true
        run: uv run python uoa_daily_top.py

      - name: Rotate signal ledger if near GitHub 100MB limit
        # 2026-09-16 outage: the hot ledger crossed 100MB and every
        # publish was rejected (GH001) while jobs stayed green. Rotation
        # moves >45d lines into monthly gzip archives; no-op below 80MB.
        run: uv run python ledger_rotate.py

      - name: Publish UOA data to site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/publish_reports.sh
