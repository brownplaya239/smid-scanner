name: Unusual Options Activity

on:
  schedule:
    # Cadence: dense at the open + into the close, ~hourly midday. The feed
    # is 15-min delayed, so hourly midday batches stay current while the
    # open/close windows (where positioning matters most) stay tight. Pages
    # deploys are serialized via pages.yml now, so scan frequency no longer
    # risks stale publishes — this cadence is purely data value vs. load
    # (thinned from the old ~30-min grid: 15 fires → 9). Cron is literal
    # UTC, off-the-hour to dodge GitHub's top-of-hour delay. Single cron per
    # fire (no EDT/EST dupes); EDT picked, EST fires 1h earlier in ET.
    #
    # Opening double-fire — GitHub routinely SKIPS the day's first cron under
    # load (observed 2026-06-03), and the Cloudflare worker backstop also
    # dispatches ~9:50, so the open is well-covered. emit_latest dedups.
    - cron: '35 13 * * 1-5'   # ~9:35 AM ET — open
    - cron: '5 14 * * 1-5'    # ~10:05 AM ET
    # ~Every 30 min through the session (v5.8-era lag fix: hourly gaps
    # + GitHub's 5-20 min cron delay left data up to ~80 min old).
    - cron: '35 14 * * 1-5'   # ~10:35 AM ET
    - cron: '5 15 * * 1-5'    # ~11:05 AM ET
    - cron: '35 15 * * 1-5'   # ~11:35 AM ET
    - cron: '5 16 * * 1-5'    # ~12:05 PM ET
    - cron: '35 16 * * 1-5'   # ~12:35 PM ET
    - cron: '5 17 * * 1-5'    # ~1:05 PM ET
    - cron: '35 17 * * 1-5'   # ~1:35 PM ET
    - cron: '5 18 * * 1-5'    # ~2:05 PM ET
    - cron: '35 18 * * 1-5'   # ~2:35 PM ET
    # Denser into the close for final positioning.
    - cron: '5 19 * * 1-5'    # ~3:05 PM ET
    - cron: '35 19 * * 1-5'   # ~3:35 PM ET
    - cron: '55 19 * * 1-5'   # ~3:55 PM ET — final before close

  workflow_dispatch:           # manual trigger anytime

jobs:
  uoa:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the UOA JSON back to the site

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UOA scan + alpha tracker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python uoa_scanner.py;  R1=$?
          python uoa_alpha.py;    R2=$?
          echo "scanner exit: $R1  |  alpha exit: $R2"
          if [ $R1 -ne 0 ]; then
            echo "::error::UOA scan failed (exit $R1)"
            exit 1
          fi

      - name: Hedge-cohort prospective monitor (append-only record)
        # Records the potential-hedge cohort's point-in-time state each
        # batch (frozen spec v1-2026-07-21; any spec change forks a new
        # version). Append-only; never affects ranking. Non-fatal.
        continue-on-error: true
        run: python hedge_monitor.py --record

      - name: Top 25 daily cumulative ranking
        # Folds this batch into the per-day accumulator and republishes
        # the diversified Top 25 (docs/reports/uoa_top25_daily.json).
        # Idempotent per batch timestamp; ET-date keyed daily reset.
        # Non-fatal: the publish step must never block on this pane.
        continue-on-error: true
        run: python uoa_daily_top.py

      - name: Publish UOA data to site
        run: bash scripts/publish_reports.sh
