name: Unusual Options Activity

on:
  schedule:
    # 3 runs/day on weekdays — off-the-hour to avoid GitHub's top-of-hour
    # cron delays. Single cron per fire time (previously had duplicate
    # EDT+EST entries that both fired year-round, doubling runs).
    # All 3 windows stay safely within market hours either DST mode, so
    # picked EDT crons across the board for closer-to-intended timing in
    # the longer summer window. EST winter fires are 1 hr earlier (still
    # within RTH 9:30 AM – 4:00 PM ET — fine).
    #
    # ~11:00 AM ET intraday flow check
    - cron: '7 15 * * 1-5'
    # ~1:30 PM ET midday flow check
    - cron: '37 17 * * 1-5'
    # ~3:45 PM ET late-session flow before close
    - cron: '47 19 * * 1-5'

  workflow_dispatch:           # manual trigger anytime

jobs:
  uoa:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # commit the UOA JSON back to the site

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UOA scan + alpha tracker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python uoa_scanner.py;  R1=$?
          python uoa_alpha.py;    R2=$?
          echo "scanner exit: $R1  |  alpha exit: $R2"
          if [ $R1 -ne 0 ]; then
            echo "::error::UOA scan failed (exit $R1)"
            exit 1
          fi

      - name: Publish UOA data to site
        run: bash scripts/publish_reports.sh
