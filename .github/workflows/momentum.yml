name: Momentum Scans

on:
  schedule:
    # 4:30 PM ET weekdays — EOD, after setup builders; daily candle complete.
    # Cron runs :33 past — GitHub heavily delays top/half-hour schedules.
    #
    # IMPORTANT — single cron, year-round:
    # GitHub cron is literal UTC with no DST handling. Previously we had both
    # 20:33 UTC (EDT-correct) and 21:33 UTC (EST-correct) listed — but BOTH
    # fired year-round, doubling our runs. Picked the EST cron because it's
    # always POST-close: 21:33 UTC = 5:33 PM ET during EDT (post-close, fine),
    # 4:33 PM ET during EST (correct intent). The EDT cron would fire at
    # 3:33 PM ET during EST winter — before the daily candle finalizes, which
    # would corrupt swing grades. So EST cron is the safe single choice.
    - cron: '33 21 * * 1-5'

  workflow_dispatch:           # manual trigger from GitHub UI anytime

jobs:
  momentum:
    runs-on: ubuntu-latest
    # Pass Polygon API key to every step — swing_report.py builds the
    # universe from grouped_daily, country_etfs.py pulls daily bars,
    # momentum_scanner.py prefers Polygon over yfinance. Missing key
    # was silently zeroing the swing universe (and breaking Top Swing
    # Upgrades) for every CI run since this workflow started.
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    permissions:
      contents: write          # allow committing archived report PDFs back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run momentum scans
        run: python momentum_scanner.py

      - name: Run swing report card
        run: python swing_report.py

      - name: Refresh economic calendar
        run: python economic_calendar.py

      - name: Refresh Earnings Whisper anticipated calendar
        run: python earnings_anticipated.py

      - name: Auto-discover @eWhispers weekly tweet image
        # Twitter's syndication endpoint rate-limits aggressively; a 429
        # or any other failure here must NEVER block the publish step
        # below (which commits swing_report.json, momentum scans, etc.).
        continue-on-error: true
        run: python earnings_whisper_tweet.py

      - name: Refresh country/region ETF YTD
        run: python country_etfs.py

      - name: Publish reports to site archive
        run: bash scripts/publish_reports.sh
