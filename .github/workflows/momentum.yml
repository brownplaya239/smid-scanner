name: Momentum Scans

on:
  schedule:
    # 4:30 PM ET weekdays — EOD, after setup builders; daily candle complete.
    # Cron runs :33 past — GitHub heavily delays top/half-hour schedules.
    #
    # IMPORTANT — single cron, year-round:
    # GitHub cron is literal UTC with no DST handling. Previously we had both
    # 20:33 UTC (EDT-correct) and 21:33 UTC (EST-correct) listed — but BOTH
    # fired year-round, doubling our runs. Picked the EST cron because it's
    # always POST-close: 21:33 UTC = 5:33 PM ET during EDT (post-close, fine),
    # 4:33 PM ET during EST (correct intent). The EDT cron would fire at
    # 3:33 PM ET during EST winter — before the daily candle finalizes, which
    # would corrupt swing grades. So EST cron is the safe single choice.
    - cron: '33 21 * * 1-5'

  workflow_dispatch:           # manual trigger from GitHub UI anytime

jobs:
  momentum:
    runs-on: ubuntu-latest
    # Pass Polygon API key to every step — swing_report.py builds the
    # universe from grouped_daily, country_etfs.py pulls daily bars,
    # momentum_scanner.py prefers Polygon over yfinance. Missing key
    # was silently zeroing the swing universe (and breaking Top Swing
    # Upgrades) for every CI run since this workflow started.
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    permissions:
      contents: write          # allow committing archived report PDFs back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run momentum scans
        run: python momentum_scanner.py

      - name: Run swing report card
        run: python swing_report.py

      - name: Missed-opportunity self-audit (learning loop 5)
        # Compares the session's biggest movers against everything we
        # surfaced and attributes each miss to the gate that hid it.
        # Non-fatal: the publish step must never block on this audit.
        continue-on-error: true
        run: python missed_opportunities.py

      - name: Technical fact table (EMAs/RSI/ATR/RS for surfaced names)
        # One nightly computation feeding grade decomposition, the Daily
        # Brief hero trade plan, RS panels, upgrade reasons, and the
        # correlation map. Runs BEFORE evening_review so tonight's picks
        # get stamped with their technical context at pick time (the
        # facts universe covers the grade ladders picks are drawn from;
        # yesterday's picks keep it warm for tomorrow's universe).
        # Non-fatal: yfinance flakes must never block the publish step.
        continue-on-error: true
        run: python technical_facts.py

      - name: Evening review (self-grade + tomorrow's watchlist)
        # Grades yesterday's picks against today's closes, logs tonight's
        # picks (with regime + technical attribution context), folds in
        # learner status + the missed audit. File-only inputs (no
        # network) — runs after the steps that produce them.
        continue-on-error: true
        run: python evening_review.py

      - name: Setup outcome tracker (gated historical performance)
        # Logs tonight's top-graded cohort and matures 5-session-old
        # cohorts against actual closes. Per-grade stats stay gated
        # ("accruing") until n>=30 — nothing publishes before it's real.
        continue-on-error: true
        run: python setup_outcomes.py

      - name: Grade engine room (migrations, persistence, health, learned)
        # The nightly closed-loop commentary: migration matrix + rarity,
        # transition outcomes (matured +5d, gated n>=30), persistence,
        # factor shifts vs yesterday's fact table, engine health from the
        # outcome trackers, and what the learner adjusted. Runs after
        # setup_outcomes + evening_review (it reads their outputs).
        continue-on-error: true
        run: python grade_engine.py

      - name: Hypothesis lab (weekly, self-gated)
        # Pairwise feature hypotheses over the matured ledger; three
        # gates (sample, split-half stability, time-ordered holdout).
        # Survivors are review candidates ONLY — nothing auto-applies.
        # Internally no-ops except Fridays / stale output.
        continue-on-error: true
        run: python hypothesis_lab.py

      - name: Refresh economic calendar
        run: python economic_calendar.py

      - name: Refresh Earnings Whisper anticipated calendar
        run: python earnings_anticipated.py

      - name: Earnings edge (implied vs realized move + verdicts)
        # yfinance (keyless) history vs the flow scanner's front-expiry
        # option read. Non-fatal — Yahoo rate limits must never block
        # the publish step.
        continue-on-error: true
        run: python earnings_edge.py

      - name: Auto-discover @eWhispers weekly tweet image
        # Twitter's syndication endpoint rate-limits aggressively; a 429
        # or any other failure here must NEVER block the publish step
        # below (which commits swing_report.json, momentum scans, etc.).
        continue-on-error: true
        run: python earnings_whisper_tweet.py

      - name: Refresh country/region ETF YTD
        run: python country_etfs.py

      - name: Publish reports to site archive
        run: bash scripts/publish_reports.sh
