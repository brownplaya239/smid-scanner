name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit message
# on master. It must follow Conventional Commits: "type(scope): summary".
# Same rules as commitlint.config.js; see CONTRIBUTING.md.
# pull_request_target: the check only reads the title, never runs PR code.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-slim
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            revert
          scopes: |
            scanner
            brief
            reports
            desk
            site
            worker
            data
            repo
            deps
            ci
            main
          # release-please's own release PRs ("chore(master): release x.y.z")
          ignoreLabels: |
            autorelease: pending
