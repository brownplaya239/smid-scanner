name: Ticker Research Brief (v2)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol (e.g. AAPL, BKSY, IONQ)'
        required: true
        type: string
      user_id:
        description: 'Requesting user id — routes the report to their private storage'
        required: false
        type: string
        default: ''

jobs:
  lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # allow committing the archived report PDF back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # v2 research brief: SEC point-in-time fundamentals, Form 4
      # economics, catalyst discovery, price chart, and the alt-data
      # appendix folded in — one PDF instead of two reports.
      - name: Generate research brief (v3)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python research_live.py --ticker "${{ inputs.ticker }}" --user-id "${{ inputs.user_id }}"

      # the brief blocks its own export on any gate failure, so a green
      # step above already means every displayed number reconciled
      - name: Assert validation report is clean
        run: |
          python - <<'EOF'
          import glob, json, sys
          # v3 writes <TICKER>_research_brief_v3_validation.json. The v2
          # report_validation/v1 shape (pdf_parsers_ok, hash_verification,
          # count_reconciliation, page_render) does not exist here: v3
          # replaced it with one structured object per check plus a
          # mutation suite, so this asserts the v3 contract instead.
          f = sorted(glob.glob("*_research_brief_v3_validation.json"))
          if not f:
              sys.exit("no v3 validation report produced")
          v = json.load(open(f[-1], encoding="utf-8"))
          checks = v.get("checks") or []
          fails = [c for c in checks
                   if c.get("status") == "FAIL"
                   and c.get("severity") in ("FATAL", "ERROR")]
          mut = v.get("mutation_tests") or {}
          bad = []
          if not checks:
              bad.append("no checks ran")
          if fails:
              bad.append("%d blocking failure(s): %s"
                         % (len(fails), ", ".join(c["check_id"]
                                                  for c in fails[:6])))
          # A green run whose gates were never exercised proves nothing.
          if not mut.get("all_checks_proven"):
              bad.append("mutation suite did not prove every check can fail "
                         "(%s/%s)" % (mut.get("passed"), mut.get("total")))
          if not v.get("ok"):
              bad.append("validator reports ok=false")
          print(json.dumps({
              "validator": v.get("validator_version"),
              "counts": v.get("counts"),
              "mutation": {k: mut.get(k)
                           for k in ("passed", "total", "all_checks_proven")},
              "warnings": [c["check_id"] for c in checks
                           if c.get("status") == "WARN"],
          }, indent=1))
          if bad:
              sys.exit("validation failed: " + "; ".join(bad))
          print("validation clean")
          EOF

      - name: Publish report to site archive
        run: bash scripts/publish_reports.sh
