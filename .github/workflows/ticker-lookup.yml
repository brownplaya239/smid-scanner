name: Ticker Research Brief (v4)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol (e.g. AAPL, BKSY, IONQ)'
        required: true
        type: string
      user_id:
        description: 'Requesting user id — routes the report to their private storage'
        required: false
        type: string
        default: ''

jobs:
  lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # allow committing the archived report PDF back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Equity Research v4: event-gated 5/6-page core + evidence appendix,
      # Finnhub consensus, issuer-exhibit KPIs, and a validation JSON that
      # records the sha256 of the exact PDFs it validated. run_for_user
      # refuses to upload anything that fails its own gate.
      - name: Generate Equity Research v4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Free tier lights the consensus rating + surprise history; a
          # premium key adds the target and forward estimates with no
          # code change. Without it the provider fails closed and the
          # rating reads NR.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python report_v4_run.py "${{ inputs.ticker }}" --user-id "${{ inputs.user_id }}" --for-user --out out_v4_user

      # the brief blocks its own export on any gate failure, so a green
      # step above already means every displayed number reconciled
      # Independent of the generator's own gate: re-read the v4 validation
      # JSON, assert no blocking failure and that the mutation suite proved
      # every check can fail, then re-hash the shipped PDFs against the
      # hashes the validation recorded — a stale or mismatched validation
      # fails the job instead of shipping.
      - name: Assert validation clean and hash-bound
        run: |
          python - <<'EOF'
          import glob, json, sys
          f = sorted(glob.glob("out_v4_user/*_validation.json"))
          if not f:
              sys.exit("no v4 validation report produced")
          v = json.load(open(f[-1], encoding="utf-8"))
          checks = v.get("checks") or []
          fails = [c for c in checks if c.get("status") == "FAIL"
                   and c.get("severity") in ("FATAL", "ERROR")]
          mut = v.get("mutation_tests") or {}
          bad = []
          if not checks:
              bad.append("no checks ran")
          if fails:
              bad.append("%d blocking failure(s): %s"
                         % (len(fails), ", ".join(c["check_id"]
                                                  for c in fails[:6])))
          if not mut.get("all_checks_proven"):
              bad.append("mutation suite did not prove every check can "
                         "fail (%s/%s)" % (mut.get("passed"),
                                           mut.get("total")))
          if not v.get("ok"):
              bad.append("validator reports ok=false")
          import report_v4_run as RR
          arts = v.get("artifacts") or {}
          if not arts:
              bad.append("validation carries no artifact hashes")
          for name, want in arts.items():
              got = RR._artifact_hashes("out_v4_user/" + name).get(name, {})
              if got.get("sha256") != want.get("sha256"):
                  bad.append("hash mismatch: %s" % name)
          print(json.dumps({
              "generated_at": v.get("generated_at"),
              "event_state": v.get("event_state"),
              "artifacts": sorted(arts),
              "mutation": {k: mut.get(k)
                           for k in ("passed", "total",
                                     "all_checks_proven")},
              "warnings": [c["check_id"] for c in checks
                           if c.get("status") == "WARN"],
          }, indent=1))
          if bad:
              sys.exit("validation failed: " + "; ".join(bad))
          print("validation clean and hash-bound")
          EOF

      - name: Publish report to site archive
        run: bash scripts/publish_reports.sh
