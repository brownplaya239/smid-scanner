name: R2 Probe

# One-off capability check for the git -> Cloudflare R2 data migration:
# can the existing CLOUDFLARE_API_TOKEN list/create R2 buckets? Prints
# only wrangler's own output (never the token). Safe to delete after.

on:
  workflow_dispatch:
    inputs:
      create:
        description: "Also create the tickerdesk-data bucket"
        type: boolean
        default: false
      verify:
        description: "Check every data file in git is byte-identical in R2"
        type: boolean
        default: false
      seed:
        description: "Upload every current data file (docs/reports/*.json + data/) to R2"
        type: boolean
        default: false
      worker_secrets:
        description: "List the worker's secret NAMES (never values)"
        type: boolean
        default: false
      sync_slack_secrets:
        description: "Copy SLACK_BOT_TOKEN + SLACK_SIGNING_SECRET from GitHub secrets to the worker"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        working-directory: cloudflare-worker
        run: npm ci
      - name: List R2 buckets
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket list
      - name: Create bucket
        if: ${{ inputs.create }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket create tickerdesk-data
      - name: Seed R2 with current data
        if: ${{ inputs.seed }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/r2_sync.py push --all
      - name: Verify git == R2
        if: ${{ inputs.verify }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/r2_sync.py verify
      - name: Sync Slack secrets to the worker
        # GitHub secret -> worker secret over stdin: the values are masked
        # in logs and never touch a file. Fails loudly if one is missing.
        if: ${{ inputs.sync_slack_secrets }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: |
          for n in SLACK_BOT_TOKEN SLACK_SIGNING_SECRET; do
            if [ -z "${!n}" ]; then
              echo "::error::GitHub secret $n is not set — run: gh secret set $n -R brownplaya239/smid-scanner"
              exit 1
            fi
            printf '%s' "${!n}" | npx wrangler secret put "$n" --name smid-scanner-discord-bot
          done
      - name: Worker secret names
        # Names/types only — wrangler never prints secret values. (Plain-
        # text vars are deliberately NOT listed: this repo's logs are
        # public and a token saved as text would print.)
        if: ${{ inputs.worker_secrets }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler secret list --name smid-scanner-discord-bot
