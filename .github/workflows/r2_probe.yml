name: R2 Probe

# One-off capability check for the git -> Cloudflare R2 data migration:
# can the existing CLOUDFLARE_API_TOKEN list/create R2 buckets? Prints
# only wrangler's own output (never the token). Safe to delete after.

on:
  workflow_dispatch:
    inputs:
      create:
        description: "Also create the tickerdesk-data bucket"
        type: boolean
        default: false
      verify:
        description: "Check every data file in git is byte-identical in R2"
        type: boolean
        default: false
      seed:
        description: "Upload every current data file (docs/reports/*.json + data/) to R2"
        type: boolean
        default: false
      worker_secrets:
        description: "List the worker's secret NAMES (never values)"
        type: boolean
        default: false
      sync_slack_secrets:
        description: "Copy SLACK_BOT_TOKEN + SLACK_SIGNING_SECRET from GitHub secrets to the worker"
        type: boolean
        default: false
      sync_news_secrets:
        description: "Copy ALPACA_KEY + ALPACA_SECRET from GitHub secrets to the worker (news wire poll)"
        type: boolean
        default: false
      sync_email_secrets:
        description: "Copy RESEND_API_KEY + FROM_EMAIL from GitHub secrets to the worker (Daily Brief sign-up confirmations)"
        type: boolean
        default: false
      sync_finnhub_secret:
        description: "Copy FINNHUB_API_KEY from GitHub secrets to the worker (macro news wire)"
        type: boolean
        default: false
      sync_posthog_secret:
        description: "Copy POSTHOG_KEY from GitHub secrets to the worker (subscribed/cancelled analytics)"
        type: boolean
        default: false

env:
  # uv: workflow steps use only the locked runtime packages, never the dev
  # tools (pytest, Ruff, Pyrefly), even when a step calls `uv run`.
  UV_NO_DEV: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        working-directory: cloudflare-worker
        run: npm ci
      - name: List R2 buckets
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket list
      - name: Create bucket
        if: ${{ inputs.create }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket create tickerdesk-data
      - name: Seed R2 with current data
        if: ${{ inputs.seed }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run scripts/r2_sync.py push --all
      - name: Verify git == R2
        if: ${{ inputs.verify }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run scripts/r2_sync.py verify
      - name: Sync Slack secrets to the worker
        # GitHub secret -> worker secret over stdin: the values are masked
        # in logs and never touch a file. Fails loudly if one is missing.
        if: ${{ inputs.sync_slack_secrets }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        run: |
          # A dashboard "Text" variable with the same name blocks
          # `secret put` (code 10053). Deploying from the repo drops
          # dashboard-only Text vars (wrangler.toml is the source of
          # truth), then the names are free for real secrets.
          npx wrangler deploy
          for n in SLACK_BOT_TOKEN SLACK_SIGNING_SECRET; do
            if [ -z "${!n}" ]; then
              echo "::error::GitHub secret $n is not set — run: gh secret set $n -R brownplaya239/smid-scanner"
              exit 1
            fi
            printf '%s' "${!n}" | npx wrangler secret put "$n" --name smid-scanner-discord-bot
          done
      - name: Sync news-wire secrets to the worker
        # Same stdin pattern as the Slack step: values are masked and never
        # touch a file. The worker's every-minute news cron starts polling
        # Alpaca as soon as both exist (no redeploy needed).
        if: ${{ inputs.sync_news_secrets }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          for n in ALPACA_KEY ALPACA_SECRET; do
            if [ -z "${!n}" ]; then
              echo "::error::GitHub secret $n is not set — run: gh secret set $n -R brownplaya239/smid-scanner"
              exit 1
            fi
            printf '%s' "${!n}" | npx wrangler secret put "$n" --name smid-scanner-discord-bot
          done
      - name: Sync email secrets to the worker
        # The worker sends the Daily Brief double opt-in email through
        # Resend. Same stdin pattern as above: values are masked and never
        # touch a file or the log.
        if: ${{ inputs.sync_email_secrets }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          for n in RESEND_API_KEY FROM_EMAIL; do
            if [ -z "${!n}" ]; then
              echo "::error::GitHub secret $n is not set — run: gh secret set $n -R brownplaya239/smid-scanner"
              exit 1
            fi
            printf '%s' "${!n}" | npx wrangler secret put "$n" --name smid-scanner-discord-bot
          done
      - name: Sync the Finnhub key to the worker
        # Only the macro news wire (?news=macro) reads it in the worker.
        if: ${{ inputs.sync_finnhub_secret }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "::error::GitHub secret FINNHUB_API_KEY is not set"
            exit 1
          fi
          printf '%s' "$FINNHUB_API_KEY" | npx wrangler secret put FINNHUB_API_KEY --name smid-scanner-discord-bot
      - name: Sync the PostHog key to the worker
        # Turns on the worker's server-side `subscribed` / `cancelled`
        # analytics events (docs_dev/ANALYTICS.md). The phc_ key is public
        # by design, but it goes in as a secret so it never sits in the
        # repo or the log. Takes effect without a redeploy.
        if: ${{ inputs.sync_posthog_secret }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          if [ -z "$POSTHOG_KEY" ]; then
            echo "::error::GitHub secret POSTHOG_KEY is not set"
            exit 1
          fi
          printf '%s' "$POSTHOG_KEY" | npx wrangler secret put POSTHOG_KEY --name smid-scanner-discord-bot
      - name: Worker secret names
        # Names/types only — wrangler never prints secret values. (Plain-
        # text vars are deliberately NOT listed: this repo's logs are
        # public and a token saved as text would print.)
        if: ${{ inputs.worker_secrets }}
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler secret list --name smid-scanner-discord-bot
