name: SMID Breakout Scanner

on:
  schedule:
    # ── DST policy (single cron per fire time, no duplicates) ──────────────
    # GitHub cron is literal UTC. Previously each fire time had two crons
    # (EDT + EST) under the assumption only the "current season" fired — but
    # BOTH fire every weekday year-round, doubling every report archive.
    # Now picking ONE cron per fire window. Crons run :07/:17/:37 past to
    # avoid GitHub's top-of-hour delay penalty.
    #
    # For each window: pick whichever cron keeps the run in the SAFE side
    # (post-open for breakouts, post-close for setups). Accept a 1-hour
    # drift during the off-season DST window.
    #
    # ── Scanner (3 runs/day) ──
    # 10:00 AM ET breakouts: MUST be post-open. EDT cron (14:07 UTC) fires
    # at 10:07 AM EDT (correct) but 9:07 AM EST (pre-open — bad).
    # EST cron (15:07 UTC) fires 11:07 AM EDT (1 hr late — fine) and
    # 10:07 AM EST (correct). Picked EST.
    - cron: '7 15 * * 1-5'

    # 11:30 AM ET — first-hour continuation: Qullamaggie's prime entry.
    # Both options safely land within market hours. Picked EDT for closer
    # match in summer (longer DST window).
    - cron: '37 15 * * 1-5'

    # 3:00 PM ET — power hour. Both options within market hours.
    # Picked EDT to keep summer fire at intended 3:07 PM ET.
    - cron: '7 19 * * 1-5'

    # ── Setup Builder (1 run/day, after close) ──
    # 4:15 PM ET — MUST be post-close (VCP volume needs finalized candle).
    # EDT cron (20:17 UTC) fires 4:17 PM EDT (correct) but 3:17 PM EST
    # (pre-close — bad). EST cron (21:17 UTC) fires 5:17 PM EDT (1 hr late
    # — fine) and 4:17 PM EST (correct). Picked EST.
    - cron: '17 21 * * 1-5'

  workflow_dispatch:           # manual trigger from GitHub UI anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # allow committing archived report PDFs back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine scan type and run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          TIME_UTC="${HOUR}${MIN}"

          # Run SMID then IWM SEQUENTIALLY — not parallel.
          # Parallel runs hammer Yahoo Finance from the same runner IP and the
          # heavier IWM scan (500 tickers) gets rate-limited to 0 results.
          # 4:15 PM ET window (EDT: 2015 UTC, EST: 2115 UTC) → setup builders
          if [ "$TIME_UTC" -ge "2010" ] && [ "$TIME_UTC" -le "2020" ] || \
             [ "$TIME_UTC" -ge "2110" ] && [ "$TIME_UTC" -le "2120" ]; then
            echo "Running setup builders (EOD base scan) — SMID then IWM"
            python setup_builder.py;       R1=$?
            python setup_builder.py --iwm; R2=$?
          else
            echo "Running breakout scanners — SMID then IWM"
            python scanner.py;       R1=$?
            python scanner.py --iwm; R2=$?
          fi

          echo "SMID exit: $R1  |  IWM exit: $R2"
          if [ $R1 -ne 0 ] || [ $R2 -ne 0 ]; then
            echo "::error::A scan process failed (SMID=$R1 IWM=$R2)"
            exit 1
          fi

      - name: Publish reports to site archive
        run: bash scripts/publish_reports.sh
