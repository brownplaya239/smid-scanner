name: Alt-Data Intelligence Lookup

# On-demand only. Alt-data is a single-stock lookup the USER requests per
# ticker; the output report is archived for reference. There is intentionally
# NO schedule — these are not a scheduled feed.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol (e.g. NVDA, ALAB, IONQ)'
        required: true
        type: string
      user_id:
        description: 'Requesting user id — routes the report to their private storage'
        required: false
        type: string
        default: ''

env:
  # uv: workflow steps use only the locked runtime packages, never the dev
  # tools (pytest, Ruff, Pyrefly), even when a step calls `uv run`.
  UV_NO_DEV: "1"

jobs:
  altdata:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # allow committing the archived report PDF back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Pull data from R2
        # Data lives in Cloudflare R2 since 2026-09-28 (not git). Records a
        # manifest so publish only uploads what this job changed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run scripts/r2_sync.py pull

      - name: Run alt-data lookup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NIMBLE_API_KEY:    ${{ secrets.NIMBLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run python alt_data.py --ticker "${{ inputs.ticker }}" --user-id "${{ inputs.user_id }}"

      - name: Publish report to site archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/publish_reports.sh
