name: Alt-Data Intelligence Lookup

on:
  schedule:
    # Daily pre-market refresh of the tracked alt-data set (weekdays).
    # 12:25 UTC = 8:25 AM ET (EDT) / 7:25 AM ET (EST) — before the open so
    # the buzz/sentiment is current for the session. GitHub cron is literal
    # UTC with no DST handling; one cron, the ~1h drift is still pre-open.
    # NOTE: each ticker costs one Anthropic + one Nimble call, so the
    # scheduled batch below is a small curated set, not the whole universe.
    - cron: '25 12 * * 1-5'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker (e.g. NVDA). Leave blank on a scheduled/manual run to refresh the tracked set.'
        required: false
        type: string

jobs:
  altdata:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # allow committing the archived report PDF back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alt-data lookup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NIMBLE_API_KEY:    ${{ secrets.NIMBLE_API_KEY }}
        run: |
          T="${{ github.event.inputs.ticker }}"
          if [ -n "$T" ]; then
            # Manual single-ticker lookup
            python alt_data.py --ticker "$T"
          else
            # Scheduled (or no-input) batch — refresh the tracked set.
            # Best-effort per ticker so one failure doesn't abort the rest.
            # Edit this list to change coverage (each name = 1 Anthropic +
            # 1 Nimble call). alt_data.py has no batch mode, so we loop.
            for t in PLTR SOFI UCTT CMBT ALAB CEVA BB AEVA SMWB; do
              echo "::group::alt-data $t"
              python alt_data.py --ticker "$t" || echo "::warning::alt-data lookup failed for $t"
              echo "::endgroup::"
            done
          fi

      - name: Publish report to site archive
        run: bash scripts/publish_reports.sh
