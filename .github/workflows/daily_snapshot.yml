name: Daily Snapshot

# Snapshots per-ticker state (grade, flow, earnings, module appearances)
# into public.signal_snapshots so the "What's New Since Last Visit"
# widget can show TRUE day-over-day diffs instead of current-state-only.
#
# Fires after Momentum Scans completes (which is the final daily run
# of swing_report + supporting files). Also supports manual dispatch
# for one-off rebuilds.

on:
  workflow_run:
    workflows: ["Momentum Scans"]
    types: [completed]
    branches: [master]

  workflow_dispatch:

env:
  # uv: workflow steps use only the locked runtime packages, never the dev
  # tools (pytest, Ruff, Pyrefly), even when a step calls `uv run`.
  UV_NO_DEV: "1"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' ||
            github.event_name == 'workflow_dispatch' }}
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Pull data from R2
        # Data lives in Cloudflare R2 since 2026-09-28 (not git). Records a
        # manifest so publish only uploads what this job changed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: uv run scripts/r2_sync.py pull --prefix reports/

      - name: Write daily snapshot
        run: uv run python daily_snapshot.py
